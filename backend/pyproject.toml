[project]
name = "backend"
version = "0.1.0"
description = "Proyecto de aprendizaje gastos"
readme = "README.md"
authors = [
    { name = "Luis", email = "qfluis@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
